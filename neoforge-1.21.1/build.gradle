plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'com.modrinth.minotaur' version '2.8.10'
    id 'idea'
}

def root = rootProject.projectDir

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir("${root}/src/generated/resources")
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

sourceSets.main.java {
    srcDir("${root}/src/main/java")
    srcDir("src/main/java")
}

sourceSets.main.resources {
    srcDirs("${root}/src/main/resources")
}

repositories {}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        publishTestClient {
            client()
            gameDirectory = project.file("${root}/run-publish-test")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        publishTestServer {
            server()
            programArgument '--nogui'
            gameDirectory = project.file("${root}/run-publish-test")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file("${root}/run-geology-minimal")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        geologyPreview {
            server()
            programArgument '--nogui'
            gameDirectory = project.file("${root}/run-geology-minimal")
            systemProperty 'realgeology.render_sections', 'true'
            systemProperty 'realgeology.preview_output', project.file("${root}/build/cross-sections").absolutePath
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file("${root}/src/generated/resources/").getAbsolutePath(), '--existing', file("${root}/src/main/resources/").getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    fileTree(dir: "${root}/libs", include: ['*.jar']).each { jar ->
        localRuntime files(jar)
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            geostrata_dependency_block: geostrataDependencyBlock('required'),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "${root}/src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

static String geostrataDependencyBlock(String type) {
    return """[[dependencies.realgeology]]
    modId="geostrata"
    type="${type}"
    reason="Real Geology arranges GeoStrata's named rocks and compatible ore blocks into geological formations."
    versionRange="[1.2.0,)"
    ordering="AFTER"
    side="BOTH"
"""
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = System.getenv("MODRINTH_PROJECT_ID") ?: "real-geology"
    versionNumber = mod_version
    versionName = "Folded strata beta"
    versionType = "beta"
    changelog = rootProject.file("CHANGELOG.md").text
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
}
