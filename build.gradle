// Root aggregator — build one or both NeoForge targets:
//   ./gradlew :neoforge-1.21.1:build
//   ./gradlew :neoforge-26.2:build
//   ./gradlew build   (both)

tasks.register('build') {
    group = 'build'
    description = 'Build all supported Minecraft versions'
    dependsOn ':neoforge-1.21.1:build', ':neoforge-26.2:build'
}
